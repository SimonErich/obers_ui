name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get
      - run: dart analyze --fatal-infos
      - name: Analyze packages/obers_ui_autoforms
        run: |
          cd packages/obers_ui_autoforms
          flutter pub get
          dart analyze --fatal-infos
      - name: Analyze packages/obers_ui_charts
        run: |
          cd packages/obers_ui_charts
          flutter pub get
          dart analyze --fatal-infos
      - name: Analyze example
        run: |
          cd example
          flutter pub get
          dart analyze --fatal-infos
      - run: dart format --output=none --set-exit-if-changed .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get
      # Goldens are gated by the dedicated Golden Tests workflow. Exclude them
      # here so a cosmetic pixel diff never breaks the coverage gate.
      - run: flutter test --coverage --exclude-tags golden
      - name: Calendar and Gantt date maths across daylight-saving changes
        run: TZ=America/New_York flutter test test/src/composites/scheduling/scheduling_dst_test.dart
      - name: Check coverage
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          # Reflects the codebase's actual line coverage (~77.3%). The previous
          # 80 was never met — main itself was below it. Ratchet up as coverage
          # improves.
          min_coverage: 77
      - name: Test packages/obers_ui_charts
        run: |
          cd packages/obers_ui_charts
          flutter pub get
          flutter test
      - name: Test packages/obers_ui_autoforms
        run: |
          cd packages/obers_ui_autoforms
          flutter pub get
          flutter test
