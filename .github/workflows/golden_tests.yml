name: Golden Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  golden:
    name: Golden Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
      - run: flutter pub get
      # Run every golden across the tree (alchemist tags them all 'golden'),
      # including goldens defined inline in component test files. CI compares
      # against the machine-independent goldens in goldens/ci/.
      - run: flutter test --tags golden
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/*.png
          retention-days: 7
