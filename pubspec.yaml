name: obers_ui
description: A comprehensive Flutter UI kit with design tokens, responsive utilities, and accessible components.
version: 0.1.2
publish_to: 'none'
topics:
  - ui
  - widgets
  - design-system
  - theme

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  desktop_drop: ^0.7.0
  # file_picker 11 needs win32 ^5, 12 needs ^6. Consumers that also pull win32
  # ^6 (e.g. a Serverpod 4 workspace) cannot resolve 11 at all: it compiles
  # against win32 5 APIs (COINIT_*, FOS_*, CoInitializeEx arity) that no longer
  # exist, so the Windows sources fail to build — even on Linux/macOS, where
  # they are still type-checked.
  #
  # 12.x is prerelease-only for now, so the constraint has to name the
  # prerelease explicitly: a plain range like '>=11.0.2 <13.0.0' still resolves
  # to 11.x, because pub skips prereleases unless opted into.
  #
  # TODO: move to ^12.0.0 once it ships stable.
  file_picker: ^12.0.0-beta.7
  flutter:
    sdk: flutter
  intl: ^0.20.0
  shared_preferences: ^2.3.0
  unicode_emojis: ^0.5.1
  web: ^1.1.1

flutter:
  fonts:
    - family: lucide
      fonts:
        - asset: lib/src/foundation/icons/lucide.ttf

dev_dependencies:
  alchemist: ^0.14.0
  custom_lint: ^0.8.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  obers_ui_charts:
    path: packages/obers_ui_charts
  very_good_analysis: ^10.0.0

