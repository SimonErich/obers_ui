name: obers_ui
description: A comprehensive Flutter UI kit with design tokens, responsive utilities, and accessible components.
version: 0.1.2
publish_to: 'none'
topics:
  - ui
  - widgets
  - design-system
  - theme

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  desktop_drop: ^0.7.0
  # Spans 11.x/12.x so consumers on win32 ^6 can resolve: 11 needs win32 ^5,
  # 12 needs ^6. Stays on 11.x unless something forces win32 6.
  file_picker: '>=11.0.2 <13.0.0'
  flutter:
    sdk: flutter
  intl: ^0.20.0
  shared_preferences: ^2.3.0
  unicode_emojis: ^0.5.1
  web: ^1.1.1

flutter:
  fonts:
    - family: lucide
      fonts:
        - asset: lib/src/foundation/icons/lucide.ttf

dev_dependencies:
  alchemist: ^0.14.0
  custom_lint: ^0.8.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  obers_ui_charts:
    path: packages/obers_ui_charts
  very_good_analysis: ^10.0.0

