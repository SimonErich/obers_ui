name: obers_ui
description: A comprehensive Flutter UI kit with design tokens, responsive utilities, and accessible components.
version: 0.1.2
publish_to: 'none'
topics:
  - ui
  - widgets
  - design-system
  - theme

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  desktop_drop: ^0.7.0
  # file_picker 11 needs win32 ^5, 12 needs ^6. Consumers that also pull win32
  # ^6 (e.g. a Serverpod 4 workspace) cannot resolve 11 at all: it compiles
  # against win32 5 APIs (COINIT_*, FOS_*, CoInitializeEx arity) that no longer
  # exist, so the Windows sources fail to build — even on Linux/macOS, where
  # they are still type-checked.
  #
  # 12.0.0 stable moved PlatformFile into file_picker_platform_interface and
  # dropped the FilePickerResult wrapper: pickFiles returns a non-nullable
  # List<PlatformFile>, and PlatformFile.size gave way to lengthSync()/length().
  # The 12.0.0-beta.x line still had the old wrapper, so the constraint must
  # exclude the prereleases — ^12.0.0 does, since pub skips prereleases unless
  # a bound names one explicitly.
  file_picker: ^12.0.0
  flutter:
    sdk: flutter
  intl: ^0.20.0
  shared_preferences: ^2.3.0
  unicode_emojis: ^0.5.1
  web: ^1.1.1

flutter:
  fonts:
    - family: lucide
      fonts:
        - asset: lib/src/foundation/icons/lucide.ttf

dev_dependencies:
  alchemist: ^0.14.0
  custom_lint: ^0.8.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  obers_ui_charts:
    path: packages/obers_ui_charts
  very_good_analysis: ^10.0.0

